name: Generate SYSTIVRA Play graphics
on:
  workflow_dispatch:
  push:
    branches: [feat/systivra-v070-stability-play-assets]
    paths:
      - 'brending/google-play/source/**'
      - 'tools/render_google_play.py'
      - '.github/workflows/play-graphics.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and verify exact sizes
        run: |
          python -m pip install pillow cairosvg
          python tools/render_google_play.py
      - name: Save generated assets on the branch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brending/google-play/assets brending/google-play/concepts-NOT-FOR-PLAY
          if ! git diff --cached --quiet; then
            git commit -m 'assets(play): render exact-size graphics from approved vector sources [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload bundled artwork
        uses: actions/upload-artifact@v4
        with:
          name: systivra-google-play-artwork
          path: brending/google-play/assets/SYSTIVRA-Play-Graphics.zip
          if-no-files-found: error
