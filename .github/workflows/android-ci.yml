name: Android build
on:
  push:
    paths: ["android/**", "README.md", "brending/google-play/real-screenshots/**", "tools/gradle-compose-retry.sh", "tools/check-readme-captures.py", "tools/check-croatian-ui.py", "tools/audit-android-surface.py", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", "README.md", "brending/google-play/real-screenshots/**", "tools/check-readme-captures.py", "tools/check-croatian-ui.py", "tools/audit-android-surface.py", ".github/workflows/android-ci.yml"]
concurrency:
  group: systivra-android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate genuine PNG gallery links and image dimensions
        run: python3 tools/check-readme-captures.py
      - name: Verify Croatian coverage for all 37 unchanged SVG boards
        run: python3 tools/check-croatian-ui.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Validate BRENDIGO application identity
        run: python3 tools/validate_application_id.py
      - name: Audit Android permissions, backups, exception sinks, sample backlog, routes and unused private declarations
        run: python3 tools/audit-android-surface.py --root . --report audit-output/ANDROID-SURFACE-AUDIT.md
      - name: Preserve automated security and dead-code evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-static-security-deadcode-audit
          path: audit-output/ANDROID-SURFACE-AUDIT.md
          if-no-files-found: warn
      - name: Assemble debug APK
        working-directory: android
        run: bash ../tools/gradle-compose-retry.sh :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: systivra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: systivra-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
