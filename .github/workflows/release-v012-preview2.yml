name: Publish SYSTIVRA v0.12.0 Preview 2
# Publishes real Android binaries only when independent screen, emulator and
# responsive QA have succeeded on exactly the same source commit.
# Debug APK / unsigned AAB, NOT a Play-signed or 1:1 certified release.
on:
  push:
    branches: [feat/systivra-v012-preview2-functional-units-icons-ui]
    paths:
      - ".github/workflows/release-v012-preview2.yml"
      - "android/**"
      - "docs/releases/v0.12.0-preview.2.md"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: systivra-v012-preview2-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable tag and Android metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.brendigo.systivra"' android/app/build.gradle.kts
          grep -F 'versionCode = 16' android/app/build.gradle.kts
          grep -F 'versionName = "0.12.0-preview.2"' android/app/build.gradle.kts
          test -s docs/releases/v0.12.0-preview.2.md
          if gh release view v0.12.0-preview.2 >/dev/null 2>&1; then
            echo "::error::Immutable release v0.12.0-preview.2 already exists; refusing overwrite"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 37
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          installed=0
          for attempt in 1 2 3; do
            if "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"; then
              installed=1
              break
            fi
            echo "::warning::Android SDK setup retry $attempt"
            sleep 12
          done
          test "$installed" -eq 1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Validate BRENDIGO Android package identity
        run: python3 tools/validate_application_id.py
      - name: Lint, unit tests, compile device tests and produce actual APK/AAB
        working-directory: android
        run: |
          gradle :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin \
            :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Enable emulator hardware acceleration
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "::error::KVM unavailable"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run all actual Android connected interaction and navigation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -noaudio
          script: bash tools/run-android-instrumentation.sh
      - name: Require independent native visuals, responsive and Splash QA for exact HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        run: |
          set -euo pipefail
          for workflow in android-reference-viewport.yml android-responsive-qa.yml android-splash-cold-start.yml; do
            echo "Checking $workflow on commit $GITHUB_SHA"
            results="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=$GITHUB_REF_NAME&per_page=40")"
            matching="$(echo "$results" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | length')"
            if [ "$matching" -eq 0 ]; then
              echo "Dispatching missing $workflow on $GITHUB_SHA"
              gh workflow run "$workflow" --repo "$GH_REPO" --ref "$GITHUB_REF_NAME"
            fi
          done

          for workflow in android-reference-viewport.yml android-responsive-qa.yml android-splash-cold-start.yml; do
            found=0
            for attempt in $(seq 1 48); do
              results="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=$GITHUB_REF_NAME&per_page=40")"
              passed="$(echo "$results" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
              failed="$(echo "$results" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.conclusion == "failure" or .conclusion == "timed_out"))] | length')"
              if [ "$passed" -ge 1 ]; then
                found=1
                echo "Passed: $workflow"
                break
              fi
              if [ "$failed" -gt 0 ]; then
                echo "::error::$workflow failed for $GITHUB_SHA"
                exit 1
              fi
              echo "Waiting for $workflow at $GITHUB_SHA ($attempt/48)"
              sleep 15
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::No successful independent run for $workflow at $GITHUB_SHA"
              exit 1
            fi
          done
      - name: Verify built package, version, byte integrity
        run: |
          set -euo pipefail
          bash tools/verify_apk_id.sh
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$BUNDLE"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          IDENTITY="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          echo "$IDENTITY"
          echo "$IDENTITY" | grep -F "name='com.brendigo.systivra'"
          echo "$IDENTITY" | grep -F "versionCode='16'"
          echo "$IDENTITY" | grep -F "versionName='0.12.0-preview.2'"
          unzip -t "$APK" >/dev/null
          unzip -t "$BUNDLE" >/dev/null
      - name: Download 38 genuine Android screen captures from matched QA run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GH_REPO/actions/workflows/android-reference-viewport.yml/runs?branch=$GITHUB_REF_NAME&per_page=40" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GH_REPO" \
            --name systivra-390x844-actual-vs-original-svg-diff \
            --dir qa/release-native
          test -d qa/release-native/screenshots
          count="$(find qa/release-native/screenshots -maxdepth 1 -name '*.png' -type f | wc -l | tr -d ' ')"
          test "$count" -eq 38 || { echo "::error::Expected 38 actual in-app PNG captures, found $count"; exit 1; }
          test -s qa/release-native/diff/summary.md
          echo "Verified 38 native unretouched Android capture files. Not Play approved."
      - name: Package exact Android build, source, artwork, genuine captures and checksums
        run: |
          set -euo pipefail
          VERSION=v0.12.0-preview.2
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SYSTIVRA-$VERSION-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/SYSTIVRA-$VERSION-unsigned.aab"
          git archive --format=zip --output="dist/SYSTIVRA-$VERSION-source.zip" HEAD
          cp brending/google-play/assets/SYSTIVRA-Play-Graphics.zip \
            "dist/SYSTIVRA-$VERSION-play-artwork.zip"
          cp brending/google-play/reference-previews-NOT-PLAY-SCREENSHOTS/SYSTIVRA-37-REFERENCE-PREVIEWS-1080x1920.zip \
            "dist/SYSTIVRA-$VERSION-reference-designs-NOT-screenshots.zip"
          (cd qa/release-native/screenshots && zip -q -j "$GITHUB_WORKSPACE/dist/SYSTIVRA-$VERSION-real-Android-emulator-screenshots-NOT-Play-approved.zip" ./*.png)
          cd dist
          for asset in SYSTIVRA-$VERSION-*; do test -s "$asset"; done
          sha256sum SYSTIVRA-$VERSION-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish immutable new GitHub preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        run: |
          set -euo pipefail
          TAG=v0.12.0-preview.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists. Refusing to replace immutable preview files."
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "SYSTIVRA v0.12.0 Preview 1" \
            --notes-file docs/releases/v0.12.0-preview.2.md
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, files: [.assets[].name]}'
      - name: Preserve exact pre-release files, emulator evidence and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-v0.12.0-preview.2-release-evidence
          path: |
            dist/*
            qa/release-native/diff/summary.md
            qa/release-native/diff/regions.md
            qa/release-native/diff/typography-baselines.md
            qa/instrumentation/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
