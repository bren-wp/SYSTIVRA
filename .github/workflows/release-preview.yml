name: Publish SYSTIVRA preview release
# Publish an immutable preview only after Android lint, unit tests,
# emulator UI tests, package identity and checksum verification succeed.
# This is not production acceptance or 1:1 visual certification.
on:
  workflow_dispatch:
  push:
    branches: [feat/systivra-v100-reference-parity-play-previews]
    paths: [".github/workflows/release-preview.yml"]
permissions:
  contents: write
concurrency:
  group: systivra-preview-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Validate BRENDIGO application identity
        run: python3 tools/validate_application_id.py
      - name: Test, build debug APK and unsigned release AAB
        working-directory: android
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Enable Android emulator hardware acceleration
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "::error::KVM device missing on runner"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::KVM inaccessible"; exit 1; }
      - name: Run Android functional UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -noaudio
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify compiled APK has the exact BRENDIGO ID
        run: bash tools/verify_apk_id.sh
      - name: Package full source, builds and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SYSTIVRA-v0.10.0-preview.2-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/SYSTIVRA-v0.10.0-preview.2-unsigned.aab
          git archive --format=zip --output=dist/SYSTIVRA-v0.10.0-preview.2-source.zip HEAD
          cp brending/google-play/assets/SYSTIVRA-Play-Graphics.zip dist/SYSTIVRA-v0.10.0-preview.2-play-artwork.zip
          cp brending/google-play/reference-previews-NOT-PLAY-SCREENSHOTS/SYSTIVRA-37-REFERENCE-PREVIEWS-1080x1920.zip dist/SYSTIVRA-v0.10.0-preview.2-reference-designs-NOT-screenshots.zip
          cd dist
          sha256sum SYSTIVRA-v0.10.0-preview.2-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish tagged GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.10.0-preview.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable preview assets."
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "SYSTIVRA v0.10.0 Preview 2" --notes-file docs/releases/v0.10.0-preview.2.md
      - name: Upload CI copies of release assets
        uses: actions/upload-artifact@v7
        with:
          name: systivra-v0.10.0-preview.2-release-assets
          path: dist/*
          if-no-files-found: error
