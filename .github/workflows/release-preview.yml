name: Publish SYSTIVRA preview release
# v0.8 stable dependencies, privacy and authentic Play capture gates.
# Release v0.6.0 requires passing unit tests and Android test compilation.
# CI must validate Kotlin and test compilation before tagging this preview.
# Versioned release. Publish only after tests, compiler, and package checks succeed.
on:
  workflow_dispatch:
  push:
    branches: [feat/systivra-v090-brendigo-application-id]
    paths: [".github/workflows/release-preview.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Validate BRENDIGO application identity
        run: python3 tools/validate_application_id.py
      - name: Test, build debug APK and unsigned release AAB
        working-directory: android
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Verify compiled APK has the exact BRENDIGO ID
        run: bash tools/verify_apk_id.sh
      - name: Package full source, builds and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SYSTIVRA-v0.9.0-preview.1-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/SYSTIVRA-v0.9.0-preview.1-unsigned.aab
          git archive --format=zip --output=dist/SYSTIVRA-v0.9.0-preview.1-source.zip HEAD
          cp brending/google-play/assets/SYSTIVRA-Play-Graphics.zip dist/SYSTIVRA-v0.9.0-preview.1-play-artwork.zip
          cd dist
          sha256sum SYSTIVRA-v0.9.0-preview.1-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish tagged GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: bren-wp/SYSTIVRA
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.9.0-preview.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable preview assets."
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "SYSTIVRA v0.9.0 Preview 1" --notes-file docs/releases/v0.9.0-preview.1.md
      - name: Upload CI copies of release assets
        uses: actions/upload-artifact@v7
        with:
          name: systivra-v0.9.0-preview.1-release-assets
          path: dist/*
          if-no-files-found: error
