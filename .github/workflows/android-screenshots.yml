name: SYSTIVRA Android screen QA
on:
  workflow_dispatch:
  push:
    branches: [feat/systivra-v100-reference-parity-play-previews]
    paths: [".github/workflows/android-screenshots.yml", "tools/capture-android-screens.sh", "tools/validate-android-screens.py", "tools/promote-real-play-screenshots.py", "tools/validate_application_id.py", "brending/google-play/reference-previews-NOT-PLAY-SCREENSHOTS/**", "android/app/src/main/**"]
concurrency:
  group: systivra-visual-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  screen-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install compile SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Compile Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Install capture validator
        run: python3 -m pip install --quiet Pillow
      - name: Validate BRENDIGO application identity
        run: python3 tools/validate_application_id.py
      - name: Capture actual Brendigo application screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
          script: |
            bash tools/capture-android-screens.sh
            cd android && gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Validate 8 genuine Play phone captures
        run: python3 tools/promote-real-play-screenshots.py
      - name: Commit real screenshots after validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brending/google-play/real-screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'assets(play): authentic Android emulator captures, pending manual review [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload real Google Play candidate images
        uses: actions/upload-artifact@v7
        with:
          name: systivra-real-screenshots-not-yet-manually-approved
          path: brending/google-play/real-screenshots/*.png
          if-no-files-found: error
      - name: Resize concept art for diagnostic comparison
        if: always()
        run: |
          python3 -m pip install --user --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          target=Path('qa/reference-scaled')
          source=Path('brending/google-play/reference-previews-NOT-PLAY-SCREENSHOTS')
          target.mkdir(parents=True,exist_ok=True)
          for ref in sorted(source.glob('[0-9][0-9]-*-REFERENCE.png')):
              if ref.name.startswith('01-splash'):
                  continue  # transient system splash needs separate evidence
              copyfile(ref,target/ref.name.replace('-REFERENCE.png','.png'))
          if len(list(target.glob('*.png'))) != 36:
              raise SystemExit('Expected exactly 36 original in-app references')
          print('Original 1080x1920 references:',len(list(target.glob('*.png'))))
          PY
      - name: Report pixel differences (not a passing 1:1 gate)
        if: always()
        continue-on-error: true
        run: |
          python3 tools/visual-diff.py --reference qa/reference-scaled --actual qa/screenshots --output qa/diff
      - name: Report screenshot inventory
        if: always()
        run: |
          echo "Captured screens: $(find qa/screenshots -name '*.png' 2>/dev/null | wc -l)"
          test -f qa/diff/report.csv && head -n 8 qa/diff/report.csv || true
      - name: Upload screenshots and diff results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-v100-reference-parity-diff-and-app-evidence
          path: |
            qa/screenshots/
            qa/debug/
            qa/screen-validation.json
            qa/diff/
          if-no-files-found: warn
