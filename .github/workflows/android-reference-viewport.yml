name: SYSTIVRA 390x844 reference viewport QA
# Independent evidence workflow: it must not change Google Play screenshots
# or certify 1:1 without same-viewport measurements and manual review.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-reference-viewport.yml"
      - "android/app/src/main/**"
      - "android/app/src/androidTest/**"
      - "android/app/src/test/**"
      - "tools/gradle-compose-retry.sh"
      - "tools/capture-reference-viewport.sh"
      - "tools/visual-diff.py"
      - "tools/check-native-visual-regression.py"
      - "tools/verify-reference-layout.py"
      - "qa/baselines/**"
      - "tools/report-surface-luminance.py"
      - "tools/report-typography-baselines.py"
      - "tools/report-screen-regions.py"
      - "tools/audit-native-screen-ink.py"
      - "tools/capture-interactive-contrast.sh"
      - "brending/screens/**"
  push:
    branches: [main, feat/systivra-visual-parity-390dp-qa, fix/systivra-qa-stability-20261115, feat/systivra-reference-actions-metrics-20261115, feat/priority-five-screen-parity-and-splash-qa, feat/systivra-v011-five-screen-preview, feat/systivra-v0112-pixel-parity]
    paths:
      - ".github/workflows/android-reference-viewport.yml"
      - "android/app/src/main/**"
      - "android/app/src/androidTest/**"
      - "android/app/src/test/**"
      - "tools/capture-android-screens.sh"
      - "tools/capture-reference-viewport.sh"
      - "tools/run-android-instrumentation.sh"
      - "tools/summarize-android-instrumentation.py"
      - "tools/check-instrumentation-shards.py"
      - "tools/validate-android-screens.py"
      - "tools/render-reference-viewport.py"
      - "tools/summarize-visual-qa.py"
      - "tools/visual-diff.py"
      - "tools/check-native-visual-regression.py"
      - "tools/verify-reference-layout.py"
      - "qa/baselines/**"
      - "tools/report-surface-luminance.py"
      - "tools/report-typography-baselines.py"
      - "brending/screens/**"
permissions:
  contents: read
concurrency:
  group: systivra-390-viewport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 37
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Compile actual debug APK
        working-directory: android
        run: bash ../tools/gradle-compose-retry.sh :app:assembleDebug
      - name: Render 36 original non-Splash SVG references at their native viewport
        run: |
          python3 -m pip install --quiet Pillow CairoSVG
          python3 tools/render-reference-viewport.py
      - name: Enable KVM before launching Android emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "::error::KVM is unavailable"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture 38 genuine application routes at exactly 390 by 844 pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader -noaudio
          script: bash tools/capture-reference-viewport.sh && bash tools/capture-interactive-contrast.sh
      - name: Compare matching viewport pixels (diagnostic, not an acceptance claim)
        run: |
          python3 tools/visual-diff.py \
            --reference qa/reference-viewport/references \
            --actual qa/reference-viewport/screenshots \
            --output qa/reference-viewport/diff \
            --max-mae-percent 4.5 --max-changed-percent 43
          python3 tools/summarize-visual-qa.py \
            --report qa/reference-viewport/diff/report.csv \
            --output qa/reference-viewport/diff/summary.md \
            --geometry native
          cat qa/reference-viewport/diff/summary.md >> "$GITHUB_STEP_SUMMARY"
          # Validate title starts, visible panel positions and chart grid
          # against source SVG-derived pixels on all 36 genuine app screens.
          python3 tools/verify-reference-layout.py \
            --reference qa/reference-viewport/references \
            --actual qa/reference-viewport/screenshots
          # Baseline: actual main commit fdfadda / run 44973870570, not design PNGs.
          # This gate catches regression but does NOT certify screen parity.
          python3 tools/check-native-visual-regression.py \
            --baseline qa/baselines/native-390x844-preview12.csv \
            --report qa/reference-viewport/diff/report.csv
          python3 tools/report-typography-baselines.py \
            --reference qa/reference-viewport/references \
            --actual qa/reference-viewport/screenshots \
            --output qa/reference-viewport/diff/typography-baselines.md \
            --max-drift-px 1
          cat qa/reference-viewport/diff/typography-baselines.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/report-screen-regions.py \
            --reference qa/reference-viewport/references \
            --actual qa/reference-viewport/screenshots \
            --output qa/reference-viewport/diff
          cat qa/reference-viewport/diff/regions.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/report-surface-luminance.py \
            --reference qa/reference-viewport/references \
            --actual qa/reference-viewport/screenshots \
            --output qa/reference-viewport/diff
          cat qa/reference-viewport/diff/surface-luminance.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/audit-native-screen-ink.py \
            --screenshots qa/reference-viewport/screenshots \
            --output qa/reference-viewport/diff
          cat qa/reference-viewport/diff/native-screen-ink.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload actual 390x844 captures and reproducible reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-390x844-actual-vs-original-svg-diff
          path: |
            qa/reference-viewport/
          if-no-files-found: warn

  # Tests run on a FRESH emulator. Capturing and force-stopping 38 routes on the
  # same emulator previously left broken SwiftShader ColorBuffer state; do not
  # weaken or disable the instrumentation assertions to hide the failure.
  instrumented-ui-tests:
    # Independent emulators prevent a single stuck test from blocking the full suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: storage-and-reports
            classes: "com.brendigo.systivra.AppThemeColorTest,com.brendigo.systivra.HistorySessionSelectionTest,com.brendigo.systivra.RecordingDeletionConfirmationTest,com.brendigo.systivra.ReportPdfInstrumentedTest,com.brendigo.systivra.data.RecordingStoreInstrumentedTest"
          - group: screen-behaviors
            classes: "com.brendigo.systivra.AdditionalReferenceInteractionTest,com.brendigo.systivra.AllScreensSmokeTest,com.brendigo.systivra.ChargingReferenceInteractionTest,com.brendigo.systivra.ContrastControlsInstrumentedTest,com.brendigo.systivra.NextPriorityInteractionTest"
          - group: navigation-and-details
            classes: "com.brendigo.systivra.NavigationSmokeTest,com.brendigo.systivra.PriorityReferenceInteractionTest,com.brendigo.systivra.ReferenceBottomBarTest,com.brendigo.systivra.ReferenceComponentInteractionAuditTest,com.brendigo.systivra.ReferenceDetailInteractionTest"
          - group: recording-and-reference
            classes: "com.brendigo.systivra.RecordingLibraryPagingTest,com.brendigo.systivra.ReferenceEntrancesTest,com.brendigo.systivra.ReferenceGeometryTest,com.brendigo.systivra.SessionLoadingAndCompactAccessTest,com.brendigo.systivra.TemperaturePreferenceInteractionTest"
    steps:
      - uses: actions/checkout@v4
      - name: Verify every Android instrumented test class is assigned once
        run: python3 tools/check-instrumentation-shards.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 37
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Compile Android debug and instrumentation packages
        working-directory: android
        run: bash ../tools/gradle-compose-retry.sh :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable hardware acceleration
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "::error::KVM is unavailable"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run connected UI tests on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SYSTIVRA_TEST_CLASSES: ${{ matrix.classes }}
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          # Use supported software rendering; swiftshader_indirect was deprecated.
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader -noaudio
          script: bash tools/run-android-instrumentation.sh
      - name: Report exact failing test cases
        if: always()
        run: |
          python3 tools/summarize-android-instrumentation.py \
            --results android/app/build/outputs/androidTest-results/connected \
            --summary qa/instrumentation/summary.md --require-results \
            --require-classes "${{ matrix.classes }}" || {
              cat qa/instrumentation/summary.md >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          cat qa/instrumentation/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve JUnit XML, HTML reports and logcat even on test failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-instrumentation-${{ matrix.group }}-junit-and-logcat
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            qa/instrumentation/
          if-no-files-found: warn
