name: SYSTIVRA genuine cold-start Splash QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-splash-cold-start.yml"
      - "android/app/src/main/**"
      - "tools/capture-splash-cold-start.sh"
      - "tools/validate-splash-capture.py"
      - "brending/screens/01-splash.svg"
  push:
    branches: [feat/priority-five-screen-parity-and-splash-qa, feat/systivra-v011-five-screen-preview, feat/systivra-v0112-pixel-parity]
    paths:
      - ".github/workflows/android-splash-cold-start.yml"
      - "tools/capture-splash-cold-start.sh"
      - "tools/validate-splash-capture.py"
      - "android/app/src/main/**"
      - "brending/screens/01-splash.svg"
permissions:
  contents: read
concurrency:
  group: systivra-splash-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cold-start-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37 with bounded retries
        timeout-minutes: 10
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "::group::Android license acceptance"
          timeout -k 5s 60s bash -c 'yes | "$1" --licenses >/dev/null' _ "$SDK_MANAGER" || true
          echo "::endgroup::"
          if [[ -f "$SDK_ROOT/platforms/android-37.0/android.jar" && -x "$SDK_ROOT/build-tools/37.0.0/aapt2" ]]; then
            echo "Required Android API 37 and build-tools already installed"
          else
            installed=0
            for attempt in 1 2 3; do
              echo "::group::SDK install attempt $attempt"
              if timeout -k 10s 160s "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"; then
                installed=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::SDK install attempt $attempt failed or timed out"
              sleep 8
            done
            test "$installed" -eq 1
          fi
      - name: Install screenshot validation tools
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet Pillow CairoSVG
      - name: Verify FFmpeg for actual Android cold-start recording
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # GitHub runner images may omit ffmpeg. apt-get pulled over 130MB
            # of OS packages and timed out; a prebuilt, self-contained
            # imageio-ffmpeg wheel avoids that OS repository bottleneck.
            python3 -m pip install --quiet imageio-ffmpeg
            binary="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            test -x "$binary"
            mkdir -p "$RUNNER_TEMP/systivra-ffmpeg"
            ln -sf "$binary" "$RUNNER_TEMP/systivra-ffmpeg/ffmpeg"
            export PATH="$RUNNER_TEMP/systivra-ffmpeg:$PATH"
            echo "$RUNNER_TEMP/systivra-ffmpeg" >> "$GITHUB_PATH"
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -version | sed -n '1p'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Build genuine debuggable SYSTIVRA APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Allow emulator KVM acceleration
        run: |
          test -e /dev/kvm || { echo "::error::KVM unavailable"; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Cold-start screenrecord BEFORE launching the real app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -noaudio
          script: bash tools/capture-splash-cold-start.sh
      - name: Preserve cold-start video, frame audit and unmodified reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-real-cold-start-splash-evidence
          path: qa/splash/
          if-no-files-found: warn
