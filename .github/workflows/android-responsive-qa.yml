name: SYSTIVRA responsive viewport capture
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-responsive-qa.yml"
      - "android/app/src/main/**"
      - "tools/capture-responsive-priority.sh"
      - "tools/validate-responsive-priority.py"
  push:
    branches: [main, feat/priority-five-screen-parity-and-splash-qa, feat/systivra-v011-five-screen-preview, feat/systivra-v0112-pixel-parity]
    paths:
      - ".github/workflows/android-responsive-qa.yml"
      - "tools/capture-responsive-priority.sh"
      - "tools/validate-responsive-priority.py"
      - "android/app/src/main/**"
permissions:
  contents: read
concurrency:
  group: systivra-responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        viewport: ["360x800", "412x915", "600x960", "800x1280", "960x600"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install required Android SDK and Pillow
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          installed=0
          for attempt in 1 2 3; do
            if "$SDK_MANAGER" "platforms;android-37.0" "build-tools;37.0.0"; then
              installed=1
              break
            fi
            echo "::warning::Android SDK download retry $attempt"
            sleep 12
          done
          test "$installed" -eq 1
          python3 -m pip install --quiet Pillow
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"
      - name: Build the actual Android application for responsive captures
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          test -e /dev/kvm || { echo "::error::KVM unavailable"; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Capture all 38 app routes at ${{ matrix.viewport }} from the real APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SYSTIVRA_VIEWPORT: ${{ matrix.viewport }}
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader -noaudio
          script: bash tools/capture-responsive-priority.sh
      - name: Display responsive QA summary
        if: always()
        run: |
          if test -s qa/responsive/${{ matrix.viewport }}/responsive-summary.md; then
            cat qa/responsive/${{ matrix.viewport }}/responsive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive all 38 real app screenshots at ${{ matrix.viewport }} and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systivra-responsive-${{ matrix.viewport }}-38-real-captures
          path: qa/responsive/${{ matrix.viewport }}/
          if-no-files-found: warn
